[project]
name = "business-idea-evaluator"
version = "0.1.0"
description = "Score business ideas with Claude, then prove the prompt works with a graded eval pipeline."
readme = "README.md"
authors = [{ name = "Katya Fedorova", email = "legion.is.my.name1984@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
bie = "bie.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bie"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: hits the real Anthropic API and costs money"]
# The default run must be free and fast. Live tests are opt-in: pytest -m live
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
# Vendored Spec Kit tooling: not ours to lint.
extend-exclude = [".specify"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call expressions in argument defaults by design.
"src/bie/cli.py" = ["B008"]
# FastAPI declares File/Form/Depends the same way.
"src/bie/api.py" = ["B008"]
